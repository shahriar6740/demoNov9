# SQL Server for the classroom demos.  Start:  docker compose up -d     Stop:  docker compose down
# The password is for this local demo only — never commit real credentials.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: querydemos-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Demo_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - querydemos-data:/var/opt/mssql

volumes:
  querydemos-data:
